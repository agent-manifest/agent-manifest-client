name: Release

# Manual only. This workflow cannot be triggered by a push, a tag, a pull
# request, or a schedule: publication is a human decision, taken once, on a
# commit that has already passed CI.
#
# It publishes ONE package per dispatch. Two packages means two dispatches, two
# approvals and two checksums typed by hand — the alternative, publishing both
# from a single approval, would halve the number of moments a human looks at
# what is about to become public.
#
# It is inert until all of the following exist:
#   - the `npm-publish` environment in this repository, with required reviewers;
#   - a trusted publisher configured on npmjs.com for the package being
#     published, pointing at this repository, this workflow file and that
#     environment;
#   - an explicit `confirm: publish` input at dispatch time;
#   - the sha-256 of the approved tarball, typed at dispatch time.
#
# The second of those cannot be satisfied for a name that is not in the
# registry yet: npm keeps the setting on the package's own page, and the page
# does not exist until the package does. The earliest version of a new name is
# therefore published by hand, once — a bootstrap publication. It reserves the
# name and makes the trusted publisher configurable, and that is all it is: it
# goes out under a dist-tag other than `latest`, it is deprecated in favour of
# the release that follows it, it cannot happen again for that name once
# trusted publishing is configured, and no credential is created in or read by
# this repository for it. Every version meant to be installed and used comes
# through this workflow, with provenance. See STEWARDSHIP.md section 3 in the
# `agent-manifest` repository, where the same limits are stated in public.
#
# Authentication is OpenID Connect (npm trusted publishing). There is no npm
# token in this repository and none is read here. Provenance is attested by npm
# from the OIDC claim, so the published package is traceable to this commit.
# These two properties are described in public in STEWARDSHIP.md section 3 of
# the `agent-manifest` repository; a change here makes that description false
# and has to be made there too.
#
# The workflow publishes the exact tarball it built, after checking that its
# sha-256 equals the value approved by hand. If the build is not reproducible,
# it stops rather than publish an artefact nobody reviewed.
#
# It does not create tags, releases, or commits. Those are made by hand
# beforehand, and the tag is what this workflow is dispatched against.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish.'
        required: true
        type: choice
        options:
          - '@agent-manifest/schema'
          - '@agent-manifest/client'
      confirm:
        description: 'Type "publish" to confirm. Anything else aborts.'
        required: true
        default: 'no'
      sha256:
        description: 'sha-256 of the approved tarball. A mismatch aborts.'
        required: true
      tag:
        description: 'npm dist-tag to publish under.'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing and provenance
    steps:
      - name: Refuse an unconfirmed dispatch
        if: ${{ inputs.confirm != 'publish' }}
        run: |
          echo "Dispatch not confirmed; nothing published."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm 11.5.1 or later.
      - name: Use an npm release that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Verify before publishing
        run: npm test

      # The vendored schema is a byte-for-byte copy of the canonical file, and
      # v1.0 is frozen. A mismatch here is drift, and drift must not be
      # published under any circumstances.
      - name: Schema parity with the published canonical file
        run: |
          set -euo pipefail
          recorded=$(python3 -c "import json;print(json.load(open('packages/schema/SOURCE.json'))['sha256'])")
          canonical_url=$(python3 -c "import json;print(json.load(open('packages/schema/SOURCE.json'))['canonical_url'])")
          local_sum=$(sha256sum packages/schema/v1.0/schema.json | cut -d' ' -f1)
          curl -sSfL "$canonical_url" -o canonical.json
          published_sum=$(sha256sum canonical.json | cut -d' ' -f1)
          rm -f canonical.json
          echo "recorded:  $recorded"
          echo "vendored:  $local_sum"
          echo "published: $published_sum"
          test "$local_sum" = "$recorded"
          test "$published_sum" = "$recorded"

      # Read the file rather than ask npm for it. `npm pkg get` writes its
      # warnings to the same stream as its answer, and setup-node leaves an
      # .npmrc here that npm warns about, so the answer arrives with a line of
      # prose in front of it and nothing downstream can parse it.
      - name: Read the version being published
        id: version
        run: |
          set -euo pipefail
          short=$(printf '%s' "${{ inputs.package }}" | cut -d/ -f2)
          version=$(python3 -c "import json;print(json.load(open('packages/$short/package.json'))['version'])")
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ inputs.package }}@$version"

      # @agent-manifest/client declares an exact dependency on
      # @agent-manifest/schema. Publishing the client first would put a package
      # in the registry that cannot be installed, which is worse than not
      # publishing it at all.
      - name: Refuse to publish the client before its dependency exists
        if: ${{ inputs.package == '@agent-manifest/client' }}
        run: |
          set -euo pipefail
          required=$(python3 -c "import json;print(json.load(open('packages/client/package.json'))['dependencies']['@agent-manifest/schema'])")
          echo "client requires @agent-manifest/schema@$required"
          npm view "@agent-manifest/schema@$required" version

      # A bootstrap publication is a hand act that happens once per name, before
      # trusted publishing can be configured. This workflow is the other thing —
      # the releases — and it says so mechanically rather than in a comment, so
      # that the two can never be confused from the dispatch form.
      #
      # What makes a publication a bootstrap is the procedure it went through
      # and what the registry recorded about it, not the number it carries. The
      # dist-tag check below is therefore the one that matters. The version
      # check is a second, narrower guard: `0.0.0` is the number the bootstrap
      # of this workspace was published under, and no release should ever
      # reoccupy it.
      - name: Refuse to publish a bootstrap version through the release workflow
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          if [ "${{ inputs.tag }}" = "bootstrap" ]; then
            echo "The bootstrap dist-tag is not published from here."
            exit 1
          fi
          if [ "$version" = "0.0.0" ]; then
            echo "0.0.0 is the bootstrap version and is published by hand, once."
            exit 1
          fi
          case "$version" in
            *-*) echo "Refusing a prerelease version: $version"; exit 1 ;;
          esac

      - name: Check that the tag matches the version being published
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          short=$(printf '%s' "${{ inputs.package }}" | cut -d/ -f2)
          ref="${GITHUB_REF#refs/tags/}"
          if [ "$GITHUB_REF" != "$ref" ] && [ "$ref" != "$short-v$version" ]; then
            echo "Dispatched against $ref but expected $short-v$version."
            exit 1
          fi

      - name: Build the tarball and check it against the approved checksum
        id: pack
        run: |
          set -euo pipefail
          file=$(npm pack -w "${{ inputs.package }}" --silent)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Contents:"
          tar -tzf "$file" | sort
          actual=$(sha256sum "$file" | cut -d' ' -f1)
          echo "approved: ${{ inputs.sha256 }}"
          echo "built:    $actual"
          if [ "$actual" != "${{ inputs.sha256 }}" ]; then
            echo "The tarball does not match the approved checksum; nothing published."
            exit 1
          fi

      - name: Publish the approved tarball
        run: npm publish "${{ steps.pack.outputs.file }}" --provenance --tag "${{ inputs.tag }}"

      # A release that cannot be installed by a stranger is a broken release,
      # and the only way to know is to be the stranger.
      - name: Verify the published package installs from the registry
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          dir=$(mktemp -d)
          cd "$dir"
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null

          # The registry is not read-your-writes: a package that was just
          # published can be missing from the read path for a few seconds. That
          # is a propagation delay, not a failed publish, and reporting the two
          # the same way is how a green release gets recorded as a red one.
          # Only ETARGET is retried; anything else stops immediately.
          attempts=6
          delay=10
          installed=no
          for i in $(seq 1 "$attempts"); do
            if out=$(npm install "${{ inputs.package }}@$version" 2>&1); then
              installed=yes
              break
            fi
            if printf '%s' "$out" | grep -qE 'ETARGET|notarget|No matching version found'; then
              echo "attempt $i/$attempts: ${{ inputs.package }}@$version not visible yet; waiting ${delay}s"
              sleep "$delay"
              continue
            fi
            echo "$out"
            echo "npm install failed for a reason other than propagation. Nothing to retry."
            exit 1
          done
          if [ "$installed" != yes ]; then
            echo "$out"
            echo "PUBLISHED BUT NOT INSTALLABLE within $((attempts * delay))s."
            echo "This is a propagation timeout, not a failed publish:"
            echo "${{ inputs.package }}@$version is in the registry and must not be republished."
            exit 1
          fi
          if [ "${{ inputs.package }}" = "@agent-manifest/schema" ]; then
            node -e "
              import('@agent-manifest/schema').then(async (m) => {
                if (m.schemaV1_0.\$id === undefined) throw new Error('no \$id');
                if (m.schemaFor('9.9') !== null) throw new Error('unknown version must be null');
                console.log('schema ok:', m.SCHEMA_VERSIONS.join(', '));
              });
            "
          else
            node -e "
              import('@agent-manifest/client').then(async (m) => {
                const { document } = m.parse('{\"manifest_version\":\"1.0\"}');
                if (m.detectVersion(document) !== '1.0') throw new Error('version not detected');
                const fp = await m.fingerprint(document);
                if (!fp.startsWith('sha256:')) throw new Error('no fingerprint');
                if (m.CAVEATS.length < 4) throw new Error('caveats missing');
                console.log('client ok:', fp);
              });
            "
          fi
